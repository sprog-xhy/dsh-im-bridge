[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-im-bridge"
version = "0.1.0"
description = "Bridge between DeepSeek Harness (dsh) and IM/collaboration tools (QQ / Feishu / WOA), cross-platform (Windows + Ubuntu)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "websockets>=12",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
feishu = [
    "cryptography>=41",
]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "cryptography>=41",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
