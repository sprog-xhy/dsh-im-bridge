# dsh-feishu 插件配置 —— 复制为 config.yaml 并填写飞书凭据
#
# 本插件只做一件事：把 dsh 桥接到飞书。其他 IM 通道不在这里配置——
# 插件入口强制 --only feishu。
#
# 凭据也可用环境变量提供：
#   DSH_IM_BRIDGE_FEISHU_APP_ID / DSH_IM_BRIDGE_FEISHU_APP_SECRET
#   DSH_IM_BRIDGE_FEISHU_WEBHOOK_URL

dsh:
  # dsh web 监听地址（桥接与 dsh 必须在同一台机器/网络）
  baseUrl: "http://127.0.0.1:10010"

bridge:
  host: "127.0.0.1"
  apiPort: 8764
  stateFile: ".dsh-im-bridge/bridge-state.json"
  maxMessageChars: 2000
  splitLongMessages: true
  catchUp: true
  notifyOnStart: true
  sendWelcomeOnBind: true
  includeReasoning: false
  sendRetries: 2

channels:
  feishu:
    enabled: true
    baseUrl: "https://open.feishu.cn"      # 国际版 Lark 改 https://open.larksuite.com
    # 二选一（都填时 webhook 优先用于发送）：
    # A) 自定义机器人 webhook（仅发送通知，最快）：
    #    webhookUrl: "https://open.feishu.cn/open-apis/bot/v2/hook/<一串token>"
    # B) 应用机器人（能双向收发，推荐）：
    appId: ""                              # ← 飞书开放平台应用 App ID
    appSecret: ""                          # ← 应用 App Secret
    # encryptKey: ""                        # 仅当事件订阅开了加密
    receiveChatTypes: ["p2p", "group"]     # 接收单聊 + 群聊 @机器人
