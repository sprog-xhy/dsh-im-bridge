[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-feishu"
version = "0.1.0"
description = "dsh-feishu: 让 dsh（DeepSeek Harness）通过飞书应用机器人收发消息的独立插件"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "dsh-im-bridge>=0.1.0",
]

[project.scripts]
dsh-feishu = "dsh_feishu.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
