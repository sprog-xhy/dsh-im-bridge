# dsh-qq 插件配置 —— 复制为 config.yaml 并填写 QQ 开放平台凭据
#
# 本插件只做一件事：把 dsh 桥接到 QQ 官方开放平台机器人（C2C 私聊）。
# 其他 IM 通道（飞书/OneBot/WOA）不在这里配置——插件入口强制 --only qq_official。
#
# 凭据也可用环境变量提供（见 .env 或直接导出）：
#   DSH_IM_BRIDGE_QQ_OFFICIAL_APP_ID / DSH_IM_BRIDGE_QQ_OFFICIAL_APP_SECRET

dsh:
  # dsh web 监听地址（桥接与 dsh 必须在同一台机器/网络，默认回环即可）
  baseUrl: "http://127.0.0.1:10010"

bridge:
  host: "127.0.0.1"          # 桥接管理 API 绑定地址
  apiPort: 8764              # 桥接管理 API 端口
  stateFile: ".dsh-im-bridge/bridge-state.json"   # 会话绑定持久化文件
  maxMessageChars: 2000      # 单条消息上限；超过自动拆成多条 [1/N] 发送
  splitLongMessages: true    # 超长自动拆分，不丢内容
  catchUp: true              # 重启后补发离线期间错过的通知
  notifyOnStart: true        # 启动时给已绑定会话发"桥接已启动"
  sendWelcomeOnBind: true    # 首次绑定发欢迎消息（含指令说明）
  includeReasoning: false    # false=只发结论；true=连思考过程一起发
  sendRetries: 2

channels:
  qq_official:
    enabled: true            # QQ 官方开放平台机器人 API（q.qq.com）
    appId: ""                # ← 填你的 AppID（纯数字）
    appSecret: ""            # ← 填你的 AppSecret
    sandbox: false           # true=沙箱(sandbox.api.bot.qq.com)，false=正式
    sendMarkdown: true       # 问题/审批用 QQ markdown 渲染；失败自动回退纯文本
    # allowUsers: []         # 可选：只允许这些用户 openid 私聊（留空=全部）
