[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-qq"
version = "0.1.0"
description = "dsh-qq: 让 dsh（DeepSeek Harness）通过 QQ 官方开放平台机器人收发明私聊消息的独立插件"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "dsh-im-bridge>=0.1.0",
]

[project.scripts]
dsh-qq = "dsh_qq.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
